<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#312e81" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Заоблена позадина -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Внатрешен бел сјај контура -->
  <rect x="34" y="34" width="444" height="444" rx="110" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" />

  <!-- Горен десен агол: QR пиксел мотив -->
  <g fill="rgba(255,255,255,0.85)">
    <!-- Finder рамка -->
    <rect x="340" y="80" width="92" height="92" rx="18" fill="white" />
    <rect x="354" y="94" width="64" height="64" rx="10" fill="#4f46e5" />
    <rect x="368" y="108" width="36" height="36" rx="6" fill="white" />
    
    <!-- Декоративни пиксели -->
    <rect x="300" y="80" width="24" height="24" rx="5" fill="rgba(255,255,255,0.7)" />
    <rect x="300" y="114" width="24" height="24" rx="5" fill="rgba(255,255,255,0.7)" />
    <rect x="300" y="148" width="24" height="24" rx="5" fill="rgba(255,255,255,0.7)" />
    <rect x="340" y="188" width="24" height="24" rx="5" fill="rgba(255,255,255,0.7)" />
    <rect x="374" y="188" width="24" height="24" rx="5" fill="rgba(255,255,255,0.7)" />
    <rect x="408" y="188" width="24" height="24" rx="5" fill="rgba(255,255,255,0.7)" />
  </g>

  <!-- Главен симбол: Математичка сума ∑ со елегантен серифен стил -->
  <text x="210" y="360" font-family="'Times New Roman', 'Cambria', serif" font-weight="900" font-style="italic" font-size="310" fill="#ffffff" text-anchor="middle" letter-spacing="-5">∑</text>

  <!-- Долен десен симбол: Едукативна ѕвезда / искра -->
  <path d="M 410,380 L 418,402 L 440,410 L 418,418 L 410,440 L 402,418 L 380,410 L 402,402 Z" fill="#fbbf24" opacity="0.95"/>
</svg>
